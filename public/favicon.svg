<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Face Gradients -->
    <!-- Top Face (Up/White-Cyan Accent) -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Right Face (Red/Rose Accent) -->
    <linearGradient id="rightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Left Face (Blue/Cyan Accent) -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Orange Accent for Stickers -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Green Accent for Stickers -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Yellow Accent for Stickers -->
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#3B82F6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer Isometric 3D Rubik's Cube Group -->
  <g filter="url(#cubeShadow)" transform="translate(0, 10)">
    
    <!-- TOP FACE (Isometric Polygon Grid) -->
    <!-- Top-Left Sticker -->
    <polygon points="256,90 200,120 256,150 312,120" fill="url(#topGradient)" rx="4" />
    <polygon points="194,124 138,154 194,184 250,154" fill="url(#topGradient)" />
    <polygon points="318,124 262,154 318,184 374,154" fill="url(#topGradient)" />
    
    <polygon points="256,158 200,188 256,218 312,188" fill="url(#yellowGradient)" />
    <polygon points="194,192 138,222 194,252 250,222" fill="url(#topGradient)" />
    <polygon points="318,192 262,222 318,252 374,222" fill="url(#topGradient)" />

    <polygon points="256,226 200,256 256,286 312,256" fill="url(#topGradient)" />

    <!-- LEFT FACE (Isometric Polygon Grid) -->
    <polygon points="132,160 188,190 188,250 132,220" fill="url(#leftGradient)" />
    <polygon points="194,190 250,220 250,280 194,250" fill="url(#leftGradient)" />
    
    <polygon points="132,228 188,258 188,318 132,288" fill="url(#orangeGradient)" />
    <polygon points="194,258 250,288 250,348 194,318" fill="url(#leftGradient)" />

    <polygon points="132,296 188,326 188,386 132,356" fill="url(#leftGradient)" />
    <polygon points="194,326 250,356 250,416 194,386" fill="url(#leftGradient)" />

    <!-- RIGHT FACE (Isometric Polygon Grid) -->
    <polygon points="262,220 318,190 318,250 262,280" fill="url(#rightGradient)" />
    <polygon points="324,190 380,160 380,220 324,250" fill="url(#rightGradient)" />

    <polygon points="262,288 318,258 318,318 262,348" fill="url(#greenGradient)" />
    <polygon points="324,258 380,228 380,288 324,318" fill="url(#rightGradient)" />

    <polygon points="262,356 318,326 318,386 262,416" fill="url(#rightGradient)" />
    <polygon points="324,326 380,296 380,356 324,386" fill="url(#rightGradient)" />
  </g>
</svg>
